<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>Inspect · Share image</title>
  <style>
    @font-face { font-family: Inter; src: url('../src/assets/fonts/inter-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
    @font-face { font-family: "Geist Mono"; src: url("../src/assets/fonts/geist-mono-latin.woff2") format("woff2"); font-weight: 400 600; font-display: block; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #fbfbfa; color: #171716; font-family: Inter, sans-serif; font-synthesis: none; -webkit-font-smoothing: antialiased; }
    main { position: relative; width: 1200px; height: 630px; }
    .copy { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); width: 440px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 700; }
    .brand img { width: 36px; height: 36px; }
    h1 { margin: 42px 0 20px; font-size: 43px; font-weight: 700; line-height: 1.12; letter-spacing: -.045em; }
    p { margin: 0; color: #74746e; font-size: 21px; line-height: 1.5; }
    .visual { position: absolute; left: 540px; top: 128px; width: 596px; height: 374px; border: 5px solid #efefeb; border-radius: 22px; overflow: hidden; background: #fbfbfa; }
    .visual img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .selection { position: absolute; left: 246px; top: 65px; width: 107px; height: 151px; border: 2px solid #096ed7; background: #096ed70d; }
    .measure { position: absolute; left: -2px; top: -28px; padding: 5px 6px; background: #096ed7; color: #fff; border-radius: 3px; font: 600 11px/1 "Geist Mono", monospace; white-space: nowrap; }
    .handles { position: absolute; left: -4px; top: -4px; width: 111px; height: 155px; overflow: visible; }
  </style>
</head>
<body>
  <main>
    <div class="copy">
      <div class="brand"><img src="../public/icon.svg" alt="">Inspect</div>
      <h1>Write-ups on the<br>things I build</h1>
      <p>Why they changed, what went wrong, and the small details, pointed at.</p>
    </div>
    <div class="visual"><img src="../src/content/posts/opening-the-case/live.jpg" alt="MovieVault's DVD cases with one inspected"><div class="selection"><span class="measure">01 &nbsp;364×514</span><svg class="handles" viewBox="0 0 111 155" aria-hidden="true"><g fill="white" stroke="#096ed7" stroke-width="2"><rect x="0" y="0" width="6" height="6"/><rect x="105" y="0" width="6" height="6"/><rect x="0" y="149" width="6" height="6"/><rect x="105" y="149" width="6" height="6"/></g></svg></div></div>
  </main>
</body>
</html>
